# Táblatulajdonlás: melyik tábla melyik modulé, a mai állapot szerint (2026-10-01).
#
# - `owner`: a tábla gazdája az architektúra-spec moduljai közül (core, llm, crawl, extract,
#   resolve, graph, findings). A gazda az a modul, amelynek a kimenete a tábla; más modul a
#   gazda lekérdező függvényein át éri el.
# - `store = true`: az entitástár táblája (`aaa2/entities/store.py`). A tár az extract modulé; az
#   extract és a resolve is ezen keresztül ír és olvas (Krisztián döntése, 2026-10-02). Ezekhez a
#   táblákhoz SQL csak a tár fájljában állhat.
# - `contracts`: a tábla soraiból épülő szerződések (`aaa2/contracts`); üres, ha a táblának ma
#   nincs szerződése.
# - `note`: amit a tulajdonlásról tudni kell.
#
# A fájlt az architektúra-teszt olvassa (`tests/architecture.py`); a teszt azt is ellenőrzi, hogy
# a migrációk minden táblája szerepel itt.

[tables._migrations]
owner = "core"
contracts = []
note = "az alkalmazott migrációk (`db/connect.py`)"

# --- crawl -----------------------------------------------------------------------------------

[tables.site]
owner = "crawl"
contracts = ["Site"]
note = "a site-profil; a frontier, a crawl és a site-profil írja"

[tables.crawl_runs]
owner = "crawl"
contracts = ["CrawlRun"]

[tables.crawl_queue]
owner = "crawl"
contracts = []

[tables.sitemap_files]
owner = "crawl"
contracts = ["SitemapFile"]

[tables.sitemap_urls]
owner = "crawl"
contracts = ["SitemapUrl"]

[tables.pages]
owner = "crawl"
contracts = ["Page", "PageMeta"]

[tables.links]
owner = "crawl"
contracts = ["Link"]

[tables.link_variants]
owner = "crawl"
contracts = ["LinkVariant"]

[tables.headings]
owner = "crawl"
contracts = []
note = "a headingek a `Block` szerződésben is megjelennek (a renderelt DOM-ból, az extract modulban)"

[tables.schema_blocks]
owner = "crawl"
contracts = ["StructuredData", "PageMeta"]
note = "a JSON-LD blokkok"

[tables.structured_data]
owner = "crawl"
contracts = ["StructuredData", "PageMeta"]
note = "a microdata-, RDFa- és Open Graph-elemek (022-es migráció); a szabálykör és a feloldás még nem olvassa"

