name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tiszta telepítés és gyors tesztsor
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Telepítés a rögzített verziókkal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Chromium a render-tesztekhez
        run: python -m playwright install chromium
      - name: Lint
        run: python -m ruff check aaa2 tests
      - name: Gyors tesztsor
        run: python -m pytest -q -p no:cacheprovider -m "not slow" -n auto
