# Az entitásgráf (M3) súlyai. A képlet a mérés után rögzül; addig ezek a kiinduló értékek.

# A `mentions` él súlya: az oldal nem sablon-említései pozíció szerint összegezve.
[mention_weights]
title = 3.0
h1 = 3.0
heading = 2.0
other = 1.0

# Az entitás site-szintű súlya: Σ súly × log2(1 + összetevő); ha az entitásnak egyetlen
# említése van, az összeg × single_mention.
[weight]
pages = 1.0              # hány oldalon szerepel
mentions = 0.5           # hány említésben
structural = 1.0         # hány oldalon áll title-, H1-, heading- vagy navigációs helyen
main_pages = 2.0         # hány oldal fő entitása
content_anchors = 0.5    # hány tartalmi belső anchor mutat az oldalaira, ahol fő entitás
nav_anchors = 0.1        # hány oldalcsoport navigációjából (menü, lábléc, oldalsáv) mutat rájuk link
single_mention = 0.25
