# AAA v2 — LLM-modellek, árak, keretek.
#
# Szolgáltatónként: a modell, a kulcs környezeti változója (a `.env`-ből is), a kimeneti
# tokenkorlát, a keret és a leállási küszöb. A küszöb a szolgáltató összes modelljének halmozott
# költségére vonatkozik (data/llm_ledger.jsonl, minden site-ról); e fölött az adapter nem hív.
#
# Árak: USD / 1M token, standard feldolgozás. A hívás napja (UTC) választja ki a sort. A kliens
# nem kér prompt-gyorsítótárat; az automatikus gyorsítótár olvasása (OpenAI, Gemini) és írása
# (OpenAI) a saját árán számol. A gondolkodási (thinking / reasoning) tokenek kimeneti áron.

[anthropic]
model = "claude-opus-5-5"
key_env = "ANTHROPIC_API_KEY"
max_output_tokens = 16000
budget_usd = 5.0
stop_usd = 4.0

[openai]
model = "gpt-6-luna"
fallback = "gpt-5.6-terra"
use_fallback = false           # true: a fallback modell hív; a gpt-6-astra nem használható
key_env = "OPENAI_API_KEY"
max_output_tokens = 16000
budget_usd = 3.0
stop_usd = 2.5

[gemini]
model = "gemini-3.8-flash"
thinking_level = "low"         # a 3.8 Flash legkisebb szintje; "minimal"-t nem fogad el
key_env = "GEMINI_API_KEY"
max_output_tokens = 16000
budget_usd = 5.0
stop_usd = 4.0

# --- Anthropic ---------------------------------------------------------------------------------
# 1M kontextusig egységes ár. Gyorsítótár-írás: az 5 perces ár.

[[prices]]
model = "claude-opus-5-5"
input = 4.00
cached_input = 0.20
cache_write = 5.00
output = 20.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = 2026-09-26

# --- OpenAI ------------------------------------------------------------------------------------
# 272K bemeneti token felett a teljes kérés a hosszú-kontextus áron.

[[prices]]
model = "gpt-6-luna"
input = 0.10
cached_input = 0.01
cache_write = 0.125
output = 0.50
source = "https://developers.openai.com/api/docs/pricing"
checked = 2026-09-26

[prices.long_context]
above_input_tokens = 272000
input = 0.20
cached_input = 0.02
cache_write = 0.25
output = 0.75

[[prices]]
model = "gpt-5.6-terra"
input = 2.00
cached_input = 0.20
cache_write = 2.50
output = 12.00
source = "https://developers.openai.com/api/docs/pricing"
checked = 2026-09-26

[prices.long_context]
above_input_tokens = 272000
input = 4.00
cached_input = 0.40
cache_write = 5.00
output = 18.00

# --- Google ------------------------------------------------------------------------------------
# Bevezető ár 2026-12-31-ig, utána a standard. Nincs prompthossz szerinti sáv.

[[prices]]
model = "gemini-3.8-flash"
valid_until = 2026-12-31
input = 0.75
cached_input = 0.075
output = 3.75
