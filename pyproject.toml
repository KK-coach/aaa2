[project]
name = "aaa2"
version = "0.1.0"
description = "AAA v2 — sitewide SEO/GEO elemzőmotor: oldalak × entitások × belső linkek"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "selectolax>=0.3",
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.8",
    "zstandard>=0.23",
    "tldextract>=5.3",
    "anthropic>=1.8",
    "openai>=3.19",
    "google-genai>=2.25",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-xdist>=3.6", "ruff>=0.6"]

[project.scripts]
aaa = "aaa2.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aaa2*"]

[tool.setuptools.package-data]
"aaa2.db" = ["*.sql"]
"aaa2.engine.config" = ["*.txt"]
"aaa2.core" = ["sites/*.toml"]
"aaa2.entities.config" = ["*.toml"]
"aaa2.resolver.config" = ["*.toml"]
"aaa2.functions.config" = ["*.toml"]
"aaa2.llm" = ["*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A `live` teszteket a tests/conftest.py hagyja ki, ha a `-m` kifejezés nem nevezi meg őket.
addopts = "--dist loadgroup"
markers = [
    "live: élő site-ot vagy fizetős LLM-API-t hív; csak kézzel, `pytest -m live`",
    "slow: felvételt visszajátszó, több adatbázisos vagy 10 mp fölötti teszt; a gyors sor kihagyja (`pytest -m 'not slow' -n auto`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]       # a v1 referenciakódja, nem része a csomagnak
